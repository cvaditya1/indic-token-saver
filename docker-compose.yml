services:
  app:
    build:
      context: .
      target: slim
    ports:
      - "8000:8000"
    env_file:
      - .env

  # Not started by `docker compose up` (that stays on the slim image).
  # docker build --target translate -t indic-token-saver:translate .
  # docker compose --profile translate up --build translate
  translate:
    profiles: ["translate"]
    build:
      context: .
      target: translate
    ports:
      - "8000:8000"
    env_file:
      - .env
