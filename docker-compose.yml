# Default `docker compose up` runs the full gateway (IndicTrans2 + torch).
# Gateway-only (no hi/te translation): docker compose --profile slim up --build app-slim

services:
  app:
    build:
      context: .
      target: translate
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Reuse host weights; first hi/te request loads models from here (can be slow).
      - ${HOME}/.cache/huggingface:/home/appuser/.cache/huggingface:ro
      - ./logs:/app/logs
      - ./data:/app/data

  app-slim:
    profiles: ["slim"]
    build:
      context: .
      target: slim
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
