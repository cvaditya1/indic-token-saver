[project]
name = "indic-token-saver"
version = "0.2.0"
description = "OpenAI-compatible proxy that logs language and published-price cost, and translates Hindi and Telugu with local IndicTrans2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Venkat Chalamchala" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.10.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
indic-token-saver = "indic_token_saver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_token_saver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
